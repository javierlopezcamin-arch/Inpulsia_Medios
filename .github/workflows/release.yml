name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, zip, mysqli, mbstring
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress

      - name: Análisis estático (seguridad y compatibilidad PHP 7.4)
        if: matrix.php == '8.4'
        run: vendor/bin/phpcs -q

      - name: Descargar WordPress
        run: |
          mkdir -p /tmp/wordpress
          curl -sSL https://wordpress.org/latest.tar.gz | tar xz -C /tmp/wordpress --strip-components=1

      - name: Ejecutar tests
        env:
          WP_CORE_DIR: /tmp/wordpress
          WP_DB_NAME: wordpress_test
          WP_DB_USER: root
          WP_DB_PASS: root
          WP_DB_HOST: 127.0.0.1:3306
        run: |
          set -o pipefail
          vendor/bin/phpunit --testdox 2>&1 | tee phpunit.log || {
            grep -E "^[0-9]+\) |Failed asserting|Error:" phpunit.log | head -20 | sed 's/^/::error::/'
            exit 1
          }

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leer versión del plugin
        id: v
        run: |
          VERSION=$(sed -n 's/^ \* Version: *//p' inpulsia-medios.php | tr -d '\r ')
          CONST=$(sed -n "s/.*INPULSIA_MEDIOS_VERSION', '\([^']*\)'.*/\1/p" inpulsia-medios.php)
          if [ -z "$VERSION" ] || [ "$VERSION" != "$CONST" ]; then
            echo "::error::La versión de la cabecera ($VERSION) y INPULSIA_MEDIOS_VERSION ($CONST) no coinciden"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Comprobar si la release ya existe
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "La v${{ steps.v.outputs.version }} ya está publicada; no se hace nada."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Empaquetar zip
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/build/inpulsia-medios"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/build/inpulsia-medios"
          cd "$RUNNER_TEMP/build"
          zip -rq "$GITHUB_WORKSPACE/inpulsia-medios.zip" inpulsia-medios
          unzip -l "$GITHUB_WORKSPACE/inpulsia-medios.zip"

      - name: Publicar release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          git log --pretty='- %s' $RANGE > notes.md
          gh release create "v$V" inpulsia-medios.zip \
            --target "$GITHUB_SHA" \
            --title "Inpulsia Medios $V" \
            --notes-file notes.md
